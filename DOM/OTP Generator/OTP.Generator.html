<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="OTP.Generator.css" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="container-fluid main-bg">
      <div class="row w-100 align-items-center justify-content-center">
        <!-- Left Card -->
        <div class="col-lg-5 d-flex justify-content-center">
          <div class="otp-card shadow">
            <div class="icon-box">
              <i class="bi bi-pc-display"></i>
              <i class="bi bi-shield-lock-fill lock"></i>
            </div>

            <h2>Verification code</h2>

            <p>
              We have sent a verification code to your registered mobile number.
            </p>

            <div class="otp-inputs my-4">
              <input type="text" id="otp1" maxlength="1" />
              <input type="text" id="otp2" maxlength="1" />
              <input type="text" id="otp3" maxlength="1" />
              <input type="text" id="otp4" maxlength="1" />
              <input type="text" id="otp5" maxlength="1" />
            </div>

            <button id="verifyBtn" class="btn verify-btn w-100">Verify</button>
          </div>
        </div>

        <!-- Right Side -->
        <div class="col-lg-5 text-white right-content">
          <h1>
            OTP <br />
            Verification <br />
            Form
          </h1>

          <h4>HTML, CSS & JavaScript</h4>
        </div>
      </div>
    </div>

    <script src="OTP.Generator.js"></script>
  </body>
</html>
