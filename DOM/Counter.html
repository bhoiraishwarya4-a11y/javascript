<!-- COUNTER APP -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Counter App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
          radial-gradient(circle at top left, #4f46e5, transparent 35%),
          radial-gradient(circle at bottom right, #9333ea, transparent 35%),
          #0f172a;

        color: white;
      }

      /* MAIN CONTAINER */

      .counter-container {
        width: 420px;
        padding: 40px;

        text-align: center;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 24px;

        backdrop-filter: blur(20px);

        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);

        animation: fadeIn 0.8s ease;
      }

      /* HEADING */

      .counter-container h1 {
        font-size: 2.2rem;
        margin-bottom: 10px;

        letter-spacing: 1px;
      }

      .subtitle {
        color: #cbd5e1;
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      /* COUNTER DISPLAY */

      .counter {
        width: 180px;
        height: 180px;

        margin: 0 auto 35px;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 4rem;
        font-weight: 700;

        color: white;

        border-radius: 50%;

        background: linear-gradient(135deg, #6366f1, #9333ea);

        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.45);

        transition: transform 0.3s ease;
      }

      .counter:hover {
        transform: scale(1.05);
      }

      /* BUTTON AREA */

      .button-group {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      /* COMMON BUTTON */

      button {
        border: none;
        outline: none;

        padding: 13px 20px;

        font-size: 1rem;
        font-weight: 600;

        border-radius: 12px;

        cursor: pointer;

        color: white;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      button:hover {
        transform: translateY(-3px);
      }

      button:active {
        transform: scale(0.95);
      }

      /* INCREMENT */

      #increment {
        background: linear-gradient(135deg, #22c55e, #16a34a);

        box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
      }

      #increment:hover {
        box-shadow: 0 12px 25px rgba(34, 197, 94, 0.45);
      }

      /* DECREMENT */

      #decrement {
        background: linear-gradient(135deg, #ef4444, #dc2626);

        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
      }

      #decrement:hover {
        box-shadow: 0 12px 25px rgba(239, 68, 68, 0.45);
      }

      /* RESET */

      #reset {
        background: linear-gradient(135deg, #64748b, #475569);

        box-shadow: 0 8px 20px rgba(100, 116, 139, 0.3);
      }

      #reset:hover {
        box-shadow: 0 12px 25px rgba(100, 116, 139, 0.45);
      }

      /* STATUS */

      .status {
        margin-top: 30px;

        color: #94a3b8;

        font-size: 0.85rem;
      }

      /* ANIMATION */

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* RESPONSIVE */

      @media (max-width: 500px) {
        .counter-container {
          width: 90%;
          padding: 30px 20px;
        }

        .button-group {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- COUNTER CARD -->

    <div class="counter-container">
      <h1>Counter App</h1>

      <p class="subtitle">Simple • Modern • Interactive</p>

      <!-- COUNTER -->

      <div class="counter" id="counter">0</div>

      <!-- BUTTONS -->

      <div class="button-group">
        <button id="increment">+ Increment</button>

        <button id="decrement">− Decrement</button>

        <button id="reset">↻ Reset</button>
      </div>

      <p class="status">Click the buttons to control the counter</p>
    </div>

    <script>
      // JavaScript for Counter

      // Initial value

      let count = 0;

      // Select HTML elements

      const counter = document.getElementById("counter");

      const incrementButton = document.getElementById("increment");

      const decrementButton = document.getElementById("decrement");

      const resetButton = document.getElementById("reset");

      // Increment

      incrementButton.addEventListener("click", () => {
        count++;

        counter.textContent = count;
      });

      // Decrement

      decrementButton.addEventListener("click", () => {
        count--;

        counter.textContent = count;
      });

      // Reset

      resetButton.addEventListener("click", () => {
        count = 0;

        counter.textContent = count;
      });
    </script>
  </body>
</html>
