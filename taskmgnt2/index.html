<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TaskFlow - Task Management</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#">
        <i class="fa-solid fa-list-check me-2"></i>
        TaskFlow
      </a>

      <span class="text-white small">
        Smart Task Management
      </span>
    </div>
  </nav>


  <!-- Main -->
  <main class="container py-5">

    <!-- Heading -->
    <div class="text-center mb-5">

      <div class="icon-circle">
        <i class="fa-solid fa-clipboard-check"></i>
      </div>

      <h1 class="fw-bold mt-3">
        Task Management
      </h1>

      <p class="text-muted">
        Organize your tasks and stay productive.
      </p>

    </div>


    <!-- Add Task Card -->
    <div class="card border-0 shadow-lg add-task-card mb-5">

      <div class="card-body p-4 p-md-5">

        <div class="d-flex align-items-center mb-4">
          <div class="section-icon">
            <i class="fa-solid fa-plus"></i>
          </div>

          <div class="ms-3">
            <h4 class="mb-1 fw-bold">Create New Task</h4>
            <p class="text-muted mb-0">
              Add a new task to your list
            </p>
          </div>
        </div>


        <div class="row g-3">

          <div class="col-md-5">

            <label class="form-label fw-semibold">
              <i class="fa-solid fa-heading me-1"></i>
              Task Title
            </label>

            <input
              type="text"
              class="form-control custom-input"
              id="taskTitleInput"
              placeholder="Enter task title"
            >

          </div>


          <div class="col-md-5">

            <label class="form-label fw-semibold">
              <i class="fa-solid fa-align-left me-1"></i>
              Description
            </label>

            <input
              type="text"
              class="form-control custom-input"
              id="taskDescriptionInput"
              placeholder="Enter task description"
            >

          </div>


          <div class="col-md-2 d-flex align-items-end">

            <button
              class="btn add-btn w-100"
              onclick="addNewTask()"
            >

              <i class="fa-solid fa-plus me-2"></i>
              Add Task

            </button>

          </div>

        </div>

      </div>
    </div>


    <!-- Task List -->
    <div class="card border-0 shadow-lg task-card">

      <div class="card-header bg-white border-0 p-4">

        <div class="d-flex justify-content-between align-items-center">

          <div>

            <h4 class="fw-bold mb-1">
              <i class="fa-solid fa-list-check me-2"></i>
              My Tasks
            </h4>

            <p class="text-muted mb-0">
              Manage your current tasks
            </p>

          </div>

          <span class="task-label">
            <i class="fa-solid fa-layer-group me-1"></i>
            Task List
          </span>

        </div>

      </div>


      <div class="table-responsive">

        <table class="table align-middle mb-0">

          <thead>

            <tr>
              <th>#</th>
              <th>Task</th>
              <th>Description</th>
              <th>Status</th>
              <th class="text-center">Actions</th>
            </tr>

          </thead>

          <tbody id="renderTasks"></tbody>

        </table>

      </div>

    </div>

  </main>


  <!-- Footer -->
  <footer class="footer text-center py-4 mt-5">

    <p class="mb-1 fw-semibold">
      <i class="fa-solid fa-list-check me-2"></i>
      TaskFlow
    </p>

    <small>
      Manage your tasks. Improve your productivity.
    </small>

  </footer>


  <script src="./script.js"></script>

</body>
</html>
